{% extends "base.html" %}

{% block content %}
<h1>Delete Task</h1>

<div class="card">
    <p class="delete-text">
        Are you sure you want to delete "<strong>{{ object.title }}</strong>"?
    </p>

    <form method="post" class="delete-form">
        {% csrf_token %}

        <div class="delete-actions">
            <button type="submit" class="btn btn-danger">
                Yes, Delete Task
            </button>

            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
