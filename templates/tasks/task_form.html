{% extends "base.html" %}

{% block content %}
<h1>
    {% if object %}
        Edit Task
    {% else %}
        Create Task
    {% endif %}
</h1>

<form method="post" class="main-form">
    {% csrf_token %}
    {% if task_request %}
        <input type="hidden" name="request" value="{{ task_request.id }}">
    {% endif %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<p>
    <a href="{% url 'dashboard' %}">Back to Dashboard</a>
</p>
{% endblock %}
