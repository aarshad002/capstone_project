{% extends "base.html" %}

{% block content %}
<h1>
    {% if object %}
        Edit Task
    {% else %}
        Create Task
    {% endif %}
</h1>

<form method="post" class="main-form">
    {% csrf_token %}

    {% if task_request %}
        <input type="hidden" name="request" value="{{ task_request.id }}">
    {% endif %}

    {{ form.as_p }}

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</form>
{% endblock %}
